name: Build and publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint:
    name: Validate Python sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile project sources
        run: python -m compileall -q agent client config context kryth prompts safety tools ui utils

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q

  windows-install-test:
    name: Clean Windows wheel install (Python ${{ matrix.python-version }})
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v6
        with:
          name: release-dists
          path: dist/
      - name: Install wheel in a clean virtual environment and verify it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $wheel = Get-ChildItem dist\kryth-*.whl | Select-Object -First 1
          if (-not $wheel) { throw 'Built KRYTH wheel is missing.' }
          $venv = Join-Path $env:RUNNER_TEMP 'kryth-wheel-venv'
          python -m venv $venv
          $python = Join-Path $venv 'Scripts\python.exe'
          $launcher = Join-Path $venv 'Scripts\kryth.exe'
          & $python -m pip install $wheel.FullName
          & $python -m pip check
          Set-Location $env:RUNNER_TEMP
          & $python -c "import os, tomllib; from importlib.metadata import version; import agent, client, config, context, hooks, kryth, main, prompts, safety, tools, ui, utils; project = os.path.join(os.environ['GITHUB_WORKSPACE'], 'pyproject.toml'); expected = tomllib.load(open(project, 'rb'))['project']['version']; assert version('kryth') == expected"
          & $python -m kryth --version
          & $launcher --version

  build:
    name: Build and validate distributions
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Check release tag matches package version
        run: >-
          python -c "import os, tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; tag = os.environ['GITHUB_REF_NAME'].removeprefix('v'); assert version == tag, f'Release tag {tag} does not match project version {version}'"
      - name: Check installer version matches package version
        run: >-
          python -c "import tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; installer = open('installer/kryth.iss', encoding='utf-8').read(); logo = open('ui/components/logo.py', encoding='utf-8').read(); assert '#define AppVersion ' + chr(34) + version + chr(34) in installer, 'installer/kryth.iss AppVersion does not match pyproject.toml'; assert 'KRYTH_VERSION = ' + chr(34) + version + chr(34) in logo, 'CLI version does not match pyproject.toml'"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  windows-installer:
    name: Build Windows installer
    needs: [build, windows-install-test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: release-dists
          path: dist/
      - name: Install Inno Setup compiler
        run: choco install innosetup --version=6.7.1 --no-progress --yes
      - name: Compile installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\kryth.iss'
      - uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: dist/installer/KRYTH-Setup-*.exe
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build, windows-install-test, windows-installer]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kryth/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-dists
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  create-github-release:
    name: Publish GitHub release after validation
    needs: [publish, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: windows-installer
          path: dist/installer
      - uses: actions/download-artifact@v6
        with:
          name: release-dists
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/installer/KRYTH-Setup-*.exe
          fail_on_unmatched_files: true
          name: KRYTH ${{ github.ref_name }}
          body: |
            ## KRYTH ${{ github.ref_name }}

            - Remove browser integration; KRYTH is browser-free.
            - Keep the CLI-reported version synchronized with package metadata.
            - Validate clean Windows wheel installs on Python 3.11–3.14.

            This release includes the wheel, source distribution, and Windows installer.
