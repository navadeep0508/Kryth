services:
  kryth:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: kryth:latest
    container_name: kryth
    stdin_open: true
    tty: true
    environment:
      API_KEY: ${API_KEY:-}
      BASE_URL: ${BASE_URL:-}
      TERM: ${TERM:-xterm-256color}
    volumes:
      - ${KRYTH_WORKSPACE:-..}:/workspace
      - kryth-config:/config
    working_dir: /workspace

volumes:
  kryth-config: