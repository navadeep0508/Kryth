[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kryth"
version = "1.0.8"
description = "KRYTH CLI: Autonomous Coding Intelligence — terminal AI coding agent with tools, sessions, and OpenAI-compatible model support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
  { name = "Navadeep" }
]
keywords = ["ai", "coding-agent", "ai-coder", "cli", "openai-compatible", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Terminals",
]

dependencies = [
  "openai>=1.0.0",
  "prompt_toolkit>=3.0.0",
  "rich>=13.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
bridge = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "websockets>=12.0",
  "playwright>=1.44.0",
]

[project.scripts]

kryth = "kryth.main:main"
kryth-cli = "kryth.main:main"

[tool.setuptools.packages.find]
where = ["src"]
