[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kryth"
version = "2.1.0"
description = "KRYTH CLI: Autonomous AI Coding Agent — Build, debug, and deploy entire applications with AI. Terminal-based coding assistant with OpenAI-compatible support, sessions, and powerful tools."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Navadeep", email = "hello@kryth.ai" }
]
keywords = [
  "ai", "artificial-intelligence", "coding-agent", "ai-coder", "autonomous-agent",
  "developer-tools", "cli", "terminal", "openai", "openai-compatible", "llm",
  "code-generation", "code-assistant", "programming-assistant", "ai-programming",
  "autonomous-coding", "ai-developer", "software-development", "devops",
  "code-automation", "ai-tools", "machine-learning", "gpt", "claude",
  "anthropic", "gemini", "ollama", "local-ai", "code-optimization",
  "debugging", "testing", "deployment", "full-stack", "web-development"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Shells",
  "Topic :: Terminals",
  "Topic :: Utilities",
]

dependencies = [
  "openai>=1.0.0",
  "prompt_toolkit>=3.0.0",
  "rich>=13.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.44.0",
]
bridge = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "websockets>=12.0",
  "playwright>=1.44.0",
]
memory = [
  "graphifyy>=0.1.0",
  "watchdog>=4.0.0",
]
vector = [
  "chromadb>=0.4.0",
]
skills = [
  "pyyaml>=6.0",
]
all = [
  "playwright>=1.44.0",
  "graphifyy>=0.1.0",
  "watchdog>=4.0.0",
  "chromadb>=0.4.0",
  "pyyaml>=6.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "websockets>=12.0",
]

[project.scripts]

kryth = "kryth.main:main"
kryth-cli = "kryth.main:main"

[tool.setuptools.packages.find]
where = ["src"]
