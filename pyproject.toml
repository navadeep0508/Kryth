[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kryth"
version = "0.0.36"
description = "An open-source terminal-based AI coding agent."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "navadeep0508" }]
keywords = ["ai", "agent", "cli", "coding-assistant", "tui", "openrouter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
    "click>=8.4,<9",
    "ddgs>=9.14,<10",
    "fastmcp>=3.4,<4",
    "httpx>=0.28,<1",
    "keyring>=25.0,<26",
    "openai>=2.44,<3",
    "packaging>=25.0,<27",
    "platformdirs>=4.10,<5",
    "prompt-toolkit>=3.0,<4",
    "pydantic>=2.13,<3",
    "rich>=15.0,<16",
    "tiktoken>=0.13,<1",
]

[project.urls]
Homepage = "https://github.com/navadeep0508/Kryth"
Repository = "https://github.com/navadeep0508/Kryth"
Issues = "https://github.com/navadeep0508/Kryth/issues"

[project.scripts]
kryth = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["agent*", "client*", "config*", "context*", "hooks*", "prompts*", "safety*", "tools*", "ui*", "utils*"]
